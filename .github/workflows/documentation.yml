name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'documentation/**'
      - '.github/workflows/documentation.yml'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [master]
    paths:
      - 'documentation/**'
      - '.github/workflows/documentation.yml'
  release:
    types: [published]
  workflow_run:
    workflows: ['Publish in GitHub Package Registry']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('documentation-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: documentation/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement documentation/requirements.txt

      - name: Test versioned publication
        run: python -m unittest discover -s documentation -p 'test_*.py'

      - name: Build versioned documentation
        run: python documentation/build_versions.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: documentation/build/versions

  deploy:
    # Pages permits deployments from master. Tag events still validate builds;
    # workflow_run publishes from the default branch after a successful release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
