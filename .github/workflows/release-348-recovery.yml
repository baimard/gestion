name: Recover Gestion 3.4.8 publication
'on':
  push:
    branches:
    - codex/issue-699
    paths:
    - .github/workflows/release-348-recovery.yml
jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: Check actor permission
      uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7
      with:
        require: write
    - name: Stop the initial publication before retrying
      id: recovery
      uses: actions/github-script@v7
      with:
        script: |-
          const params = {owner: context.repo.owner, repo: context.repo.repo, run_id: 43381005553};
          let run = (await github.rest.actions.getWorkflowRun(params)).data;
          if (run.conclusion === 'success') {
            core.notice('Initial publication already succeeded; no retry needed.');
            core.setOutput('needed', 'false');
            return;
          }
          if (run.status !== 'completed') {
            await github.rest.actions.cancelWorkflowRun(params);
            for (let attempt = 0; attempt < 24; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              run = (await github.rest.actions.getWorkflowRun(params)).data;
              if (run.status === 'completed') break;
            }
            if (run.status !== 'completed') throw new Error('Initial publication still running; retry aborted to avoid concurrent writes.');
          }
          core.setOutput('needed', run.conclusion === 'success' ? 'false' : 'true');
    - name: Set app env
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
        case "$GITHUB_EVENT_NAME" in
          release) APP_VERSION="$RELEASE_TAG" ;;
          push) APP_VERSION="3.4.8" ;;
          workflow_dispatch) APP_VERSION="$REQUESTED_RELEASE_TAG" ;;
          *) exit 1 ;;
        esac
        [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: 'false'
        path: ${{ env.APP_NAME }}
        ref: ${{ env.APP_VERSION }}
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Get app version number
      id: app-version
      uses: skjnldsv/xpath-action@f5b036e9d973f42c86324833fd00be90665fbf77
      with:
        filename: ${{ env.APP_NAME }}/appinfo/info.xml
        expression: //info//version/text()
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Validate app version against tag
      run: |
        [ "${{ env.APP_VERSION }}" = "${{ fromJSON(steps.app-version.outputs.result).version }}" ]
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Get appinfo data
      id: appinfo
      uses: skjnldsv/xpath-action@f5b036e9d973f42c86324833fd00be90665fbf77
      with:
        filename: ${{ env.APP_NAME }}/appinfo/info.xml
        expression: //info//dependencies//nextcloud/@min-version
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Get php version
      id: php-versions
      uses: icewind1991/nextcloud-version-matrix@58becf3b4bb6dc6cef677b15e2fd8e7d48c0908f
      with:
        filename: ${{ env.APP_NAME }}/appinfo/info.xml
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Set up php ${{ steps.php-versions.outputs.php-min }}
      uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a
      with:
        php-version: ${{ steps.php-versions.outputs.php-min }}
        coverage: none
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Audit locked PHP dependencies
      working-directory: ${{ env.APP_NAME }}
      run: composer audit --locked
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Audit locked JavaScript dependencies
      working-directory: ${{ env.APP_NAME }}
      run: npm audit --package-lock-only --audit-level=low
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Install Composer dependencies (no-dev)
      run: |
        cd ${{ env.APP_NAME }}
        composer install --no-dev --prefer-dist --no-progress --no-suggest
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Install JavaScript dependencies
      working-directory: ${{ env.APP_NAME }}
      run: npm ci
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Build production JavaScript
      working-directory: ${{ env.APP_NAME }}
      run: make build-js-production
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Verify production JavaScript bundles
      working-directory: ${{ env.APP_NAME }}
      run: make verify-js-production
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Checkout server ${{ fromJSON(steps.appinfo.outputs.result).nextcloud.min-version }}
      continue-on-error: 'true'
      id: server-checkout
      run: |
        NCVERSION='${{ fromJSON(steps.appinfo.outputs.result).nextcloud.min-version }}'
        timeout 120 wget --quiet --timeout=30 --tries=2 "https://download.nextcloud.com/server/releases/latest-$NCVERSION.zip"
        unzip latest-$NCVERSION.zip
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Checkout compatible server stable branch fallback
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      if: ${{ steps.recovery.outputs.needed == 'true' && (steps.server-checkout.outcome != 'success') }}
      with:
        persist-credentials: 'false'
        submodules: 'true'
        repository: nextcloud/server
        ref: stable${{ fromJSON(steps.appinfo.outputs.result).nextcloud.min-version }}
        path: nextcloud
    - name: Package and sign app
      run: |
        echo '${{ secrets.APP_PRIVATE_KEY }}' > ${{ env.APP_NAME }}.key
        wget --quiet "https://github.com/nextcloud/app-certificate-requests/raw/master/${{ env.APP_NAME }}/${{ env.APP_NAME }}.crt"
        cd ${{ env.APP_NAME }}
        make appstore APP_PRIVATE_KEY="../${{ env.APP_NAME }}.key" APP_CERTIFICATE="../${{ env.APP_NAME }}.crt" occ="php ../nextcloud/occ"
        cd build/artifacts/appstore
        openssl dgst -sha512 -sign ../../../../${{ env.APP_NAME }}.key ./${{ env.APP_NAME }}.tar.gz | openssl base64 > ./shasum.txt
        cat ./shasum.txt
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Attach tarball to github release
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      id: attach_to_release
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.APP_NAME }}/build/artifacts/appstore/${{ env.APP_NAME }}.tar.gz
        asset_name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.tar.gz
        tag: ${{ env.APP_VERSION }}
        overwrite: 'true'
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Upload shasum to release
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      id: attach_to_release_shasum
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.APP_NAME }}/build/artifacts/appstore/shasum.txt
        asset_name: shasum.${{ env.APP_VERSION }}.txt
        tag: ${{ env.APP_VERSION }}
        overwrite: 'true'
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    - name: Upload app to Nextcloud appstore
      uses: nextcloud-releases/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1
      with:
        app_name: ${{ env.APP_NAME }}
        appstore_token: ${{ secrets.APPSTORE_TOKEN }}
        download_url: ${{ steps.attach_to_release.outputs.browser_download_url }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      if: ${{ steps.recovery.outputs.needed == 'true' }}
    if: github.event.deleted == false
